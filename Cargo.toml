[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/soheil-mp/pecten"
homepage = "https://github.com/soheil-mp/pecten"
authors = ["Soheil Mohammadpour"]
publish = false

[workspace.dependencies]
pecten-vision = { path = "crates/pecten-vision", version = "1.0.0" }
pecten-proto = { path = "crates/pecten-proto", version = "1.0.0" }
pyo3 = { version = "0.30.1", default-features = false, features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented exceptions to `pedantic`:
# - module_name_repetitions: names such as `vision::VisionError` read better in docs.
module_name_repetitions = "allow"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.bench]
debug = true
