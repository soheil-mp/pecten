name: Feature request
description: Propose a new capability or a change to an existing one.
labels: [type:feature]
body:
  - type: markdown
    attributes:
      value: |
        Pecten's scope is set by its ADRs: deterministic perception with no machine learning,
        privacy by design, and synthetic or public, non-personal data only. Requests outside that
        scope will be closed with a pointer to the relevant ADR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Pecten do instead? Include data formats, standards or references.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: roadmap
    attributes:
      label: Related roadmap item
      placeholder: M8.4
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal needs no machine learning, model APIs or training data (ADR-0002).
          required: true
        - label: The proposal needs no personal data and no user accounts (ADR-0004).
          required: true
